name: bear_build_test

on:
  workflow_dispatch:
  
env:
  GH_ANNOTATIONS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # Step base required dependencies
    - name: Setup dependencies
      run: |
          sudo apt-get update
          sudo apt-get install cmake ninja-build python3-pyelftools python3-regex python3-polib

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout ${{ github.event.ref }}
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.ref }}
        submodules: true
        fetch-depth: 0

    - name: Cache Dependencies
      uses: actions/cache@v5
      id: cache-pkgs
      with:
          path: ".dependencies"
          key: "build-deps-1_0_0-linux"

    - name: Setup build dependencies
      run: |
          ./utils/bootstrap.py

    - name: Cache permissions
      run: sudo chmod -R 744 .dependencies

    - name: Build
      run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="../cmake/AvrGcc.cmake" -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja
    
    - name: Rename files
      run: bash .github/workflows/rename_hex.sh

    - name: Upload MK3S and MK2.5S files
      uses: actions/upload-artifact@v7
      with:
        name: Firmware
        path: |
             build/release/MK3S*.hex
             build/release/MK25S*.zip
        
    #- name: RELEASE THE KRAKEN
    #  if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/t') || startsWith(github.ref, 'refs/tags/c')
    #  uses: "marvinpinto/action-automatic-releases@latest"
    #  with:
    #    repo_token: "${{ secrets.GITHUB_TOKEN }}"
    #    automatic_release_tag: ${{ github.ref_name }}
    #    draft: true
    #    files: |
    #      ${{ github.workspace }}/build/release/*.hex
    #      ${{ github.workspace }}/build/release/*.zip

  check-lang:
    name: Check Lang
    runs-on: ubuntu-latest

    steps:
    # Setup base required dependencies
    - name: Setup dependencies
      run: |
          sudo apt-get update
          sudo apt-get install gcc-11 g++11 lcov cmake ninja-build python3-pyelftools python3-regex python3-polib

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout ${{ github.event.ref }}
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.ref }}
        submodules: true
        fetch-depth: 0

    - name: Cache Dependencies
      uses: actions/cache@v5
      id: cache-pkgs
      with:
          path: ".dependencies"
          key: "build-deps-1_0_0-linux"

    - name: Setup build dependencies
      run: |
          ./utils/bootstrap.py

    - name: Cache permissions
      run: sudo chmod -R 744 .dependencies

    - name: Run check
      run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="../cmake/AvrGcc.cmake" -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja check_lang

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    # setup base required dependencies
    - name: Setup dependencies
      run: |
          sudo apt-get update
          sudo apt-get install gcc-11 g++11 lcov cmake ninja-build python3-pyelftools python3-regex python3-polib

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout ${{ github.event.ref }}
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.ref }}
        submodules: true
        fetch-depth: 0

    - name: Cache Dependencies
      uses: actions/cache@v5
      id: cache-pkgs
      with:
          path: ".dependencies"
          key: "build-deps-1_0_0-linux"

    - name: Setup build dependencies
      run: |
          ./utils/bootstrap.py

    - name: Cache permissions
      run: sudo chmod -R 744 .dependencies

    - name: Run check
      run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          ninja test_run_all
